name: Format

on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/format.yaml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/format.yaml'

jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check with ktfmt
        run: ./gradlew ktfmtCheck
      - name: Show formatting diff
        if: failure()
        run: ./gradlew ktfmtFormat && git diff
      - name: Save formatting patch
        if: failure()
        run: git diff > ktfmt.patch
      - name: Upload formatting patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktfmt-patch
          path: ktfmt.patch
